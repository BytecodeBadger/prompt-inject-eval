[project]
name = "prompt-inject-eval"
version = "0.1.0"
description = "Adversarial prompt injection guardrail evaluation suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"datasets>=4.0.0",
	"ipykernel>=7.1.0",
	"joblib>=1.4.0",
	"matplotlib>=3.10.0",
	"nbconvert>=7.16.6",
	"nbformat>=5.10.4",
	"numpy>=2.3.0",
	"pandas>=2.3.0",
	"plotly>=6.1.0",
	"scikit-learn>=1.7.0",
	"sentence-transformers>=5.0.0",
	"torch>=2.8.0",
	"transformers>=5.12.1",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.4.0",
]

[project.scripts]
guardrail-eval = "guardrail.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail", "src/evaluation", "src/artifacts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
